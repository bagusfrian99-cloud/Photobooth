<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Photobooth Studio v1.0</title>
  <link rel="manifest" href="./manifest.json?v=1.0.0">
  <meta name="theme-color" content="#0f172a">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png?v=1.0.0">
  <link rel="apple-touch-icon" href="./icons/icon-192.png?v=1.0.0">
  <link rel="stylesheet" href="style.css?v=1.0.0">
</head>
<body>
  <div class="kiosk-app">
    <main class="view-viewport">
      <div class="floating-brand">
        <span>📸</span> <strong>Photobooth v1.0</strong>
      </div>
      <div id="videoContainer" class="video-container">
        <video id="webcam" autoplay playsinline muted class="mirror"></video>
        <div id="countdownOverlay" class="countdown-overlay"></div>
        <div id="flashOverlay" class="flash-overlay"></div>
      </div>
      <div id="resultContainer" class="result-container" style="display: none;">
        <img id="resultImage" alt="Hasil Foto">
      </div>
    </main>

    <aside class="control-panel">
      <div id="cameraControls" class="panel-section active">
        <div class="panel-header">
          <h3>Pengaturan v1.0</h3>
        </div>
        <div class="control-grid">
          <div class="control-item">
            <label for="cameraSelect">Kamera</label>
            <select id="cameraSelect" disabled><option>Memuat...</option></select>
          </div>
          <div class="control-item">
            <label for="filterSelect">Filter</label>
            <select id="filterSelect">
              <option value="none">Normal</option>
              <option value="grayscale(100%)">Hitam Putih</option>
              <option value="sepia(80%)">Vintage Sepia</option>
              <option value="contrast(140%)">High Contrast</option>
              <option value="hue-rotate(180deg)">Cyberpunk</option>
            </select>
          </div>
          <div class="control-item">
            <label for="modeSelect">Mode</label>
            <select id="modeSelect">
              <option value="strip4">Photobooth Strip (4-Cut)</option>
              <option value="single">Single Photo (1 Foto)</option>
            </select>
          </div>
          <div class="control-item">
            <label for="timerSelect">Timer</label>
            <select id="timerSelect">
              <option value="3" selected>3 Detik</option>
              <option value="5">5 Detik</option>
              <option value="0">Tanpa Timer</option>
            </select>
          </div>
          <div class="control-item checkbox-item">
            <label class="toggle-switch">
              <input type="checkbox" id="chkMirror" checked>
              <span class="toggle-slider"></span>
              <span class="toggle-label">Efek Cermin</span>
            </label>
          </div>
        </div>
        <div class="action-box">
          <button id="btnCapture" class="btn-capture" disabled>
            <span class="btn-icon">📸</span>
            <span>AMBIL FOTO</span>
          </button>
        </div>
      </div>

      <div id="resultControls" class="panel-section" style="display: none;">
        <div class="panel-header">
          <h3>Hasil Foto</h3>
        </div>
        <div id="frameStyleControls" class="control-item">
          <label>Warna Frame Strip</label>
          <div class="color-picker">
            <button class="color-btn active" data-color="#ffffff" style="background:#ffffff;"></button>
            <button class="color-btn" data-color="#1e293b" style="background:#1e293b;"></button>
            <button class="color-btn" data-color="#fbcfe8" style="background:#fbcfe8;"></button>
            <button class="color-btn" data-color="#bae6fd" style="background:#bae6fd;"></button>
            <button class="color-btn" data-color="#fef08a" style="background:#fef08a;"></button>
          </div>
        </div>
        <div class="action-box vertical">
          <button id="btnDownload" class="btn-download">💾 SIMPAN PNG</button>
          <button id="btnRetake" class="btn-retake">🔄 FOTO ULANG</button>
        </div>
      </div>

      <div id="statusMsg" class="status-msg"></div>
    </aside>
  </div>

  <canvas id="renderCanvas" style="display: none;"></canvas>
  <script src="app.js?v=1.0.0"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js?v=1.0.0', { scope: './' })
          .then(reg => {
            console.log('SW v1.0 Ready!', reg);
            // Otomatis cek update terbaru dari server
            reg.update();
            reg.onupdatefound = () => {
              const installingWorker = reg.installing;
              installingWorker.onstatechange = () => {
                if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                  console.log('Update baru terdeteksi! Memperbarui cache...');
                  window.location.reload();
                }
              };
            };
          })
          .catch(err => console.error('SW Error:', err));

        let refreshing = false;
        navigator.serviceWorker.addEventListener('controllerchange', () => {
          if (!refreshing) {
            refreshing = true;
            window.location.reload();
          }
        });
      });
    }
  </script>
</body>
</html>
